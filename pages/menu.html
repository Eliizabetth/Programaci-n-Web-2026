<html>
<head>
    <meta charset ="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Menú de comida y bebidas de La Jalisco.">
    <meta name="author" content="Daiana Elizabeth Medina Martinez">
    <title>Menú de La Jalisco</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/style-pages.css">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
          <header>
            <div class = "menu container">
            <button type="button" class="btn-menu" id="btn-menu">
            ☰
            </button>
                <a href="../index.html">
                    <img src="../img/Index-logo.png" class="logo" alt="Logo de La Jalisco">
                </a>
                <nav class="navbar">
                    <a href="../index.html">Casa</a>
                    <a href="menu.html">Menú</a>
                    <a href="eventos.html">Eventos</a>
                    <a href="contacto.html">Contacto</a>
            </nav>
            <button type="button" class="btn-tema" id="btn-tema">
            ☀ Modo claro
            </button>
        </div>
            
    </header>

   <main class="container">
        <h1>Nuestro menú</h1>
        <p>Encuentra tu antojo. Explora nuestros platos y bebidas.</p>
        
        <div class="buscador">
            <input
                type="search"
                id="buscar-producto"
                placeholder="Buscar en el menú...">
        </div>

        <div class="filtros">
            <button class="pill activo">Todos</button>
            <button class="pill">Hamburguesas</button>
            <button class="pill">Bebidas</button>
            <button class="pill">Alitas</button>
            <button class="pill">Boneless</button>
        </div>

        <section class="destacados">
            <h2>Para comer</h2>

            <section id="contenedor-menu" class="productos">
            
            </section>
        </section>
    </main>

    <footer>
        <p>2026 La Jalisco. Todos los derechos reservados.</p>
    </footer>

    <script src="../js/interacciones.js" defer></script>
    <script type="module" src="../js/main.js"></script>
